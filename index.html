<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Bir Notum Var... 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #08070a;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
            transition: background 2s ease-in-out;
        }

        body.active-theme {
            background: radial-gradient(circle at center, #2e142e 0%, #0d0614 100%);
        }

        
        .envelope-wrapper {
            cursor: pointer;
            text-align: center;
            z-index: 30;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .envelope-wrapper:hover {
            transform: scale(1.05);
        }

        .envelope {
            width: 280px;
            height: 180px;
            background: #ffffff;
            border-radius: 12px;
            position: relative;
            box-shadow: 0 0 35px rgba(255, 255, 255, 0.15), 0 15px 35px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .heart-seal {
            font-size: 3rem;
            z-index: 5;
            animation: pulse 1.2s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .envelope-hint {
            color: #888;
            margin-top: 25px;
            font-size: 0.95rem;
            letter-spacing: 1px;
            animation: fadeInOut 1.5s infinite alternate;
        }

        @keyframes fadeInOut {
            from { opacity: 0.4; }
            to { opacity: 1; }
        }

        .envelope-wrapper.hide {
            opacity: 0;
            transform: translateY(-60px) scale(0.7);
            pointer-events: none;
        }

      
        .card-container {
            position: absolute;
            opacity: 0;
            transform: scale(0.85) translateY(30px);
            transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0.4s;
            max-width: 560px;
            width: 88%;
            padding: 40px 30px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: #ffffff;
            z-index: 10;
            pointer-events: none;
        }

        .card-container.show {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        .card-title {
            font-family: 'Caveat', cursive;
            font-size: 2.4rem;
            color: #ffb7c5;
            margin-bottom: 20px;
        }

        .card-body {
            font-size: 1.15rem;
            line-height: 1.8;
            color: #ececec;
            font-weight: 500;
            min-height: 120px;
        }

        .click-hint-badge {
            display: inline-block;
            margin-top: 25px;
            padding: 8px 18px;
            background: rgba(255, 183, 197, 0.15);
            color: #ffb7c5;
            border-radius: 20px;
            font-size: 0.85rem;
            border: 1px dashed rgba(255, 183, 197, 0.4);
            opacity: 0;
            transition: opacity 1s ease 3s;
        }

        .click-hint-badge.show {
            opacity: 1;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-5px); }
        }

        
        .spawned-flower {
            position: absolute;
            font-size: 2.3rem;
            pointer-events: none;
            z-index: 25;
            animation: popFlower 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.27) forwards;
        }

        .spawned-text {
            position: absolute;
            font-size: 0.95rem;
            font-weight: 700;
            color: #ffffff;
            background: rgba(255, 105, 180, 0.45);
            backdrop-filter: blur(5px);
            padding: 5px 14px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            pointer-events: none;
            z-index: 26;
            animation: floatUpText 2s ease-out forwards;
            white-space: nowrap;
        }

        @keyframes popFlower {
            0% { transform: translate(-50%, -50%) scale(0) rotate(-40deg); opacity: 0; }
            70% { transform: translate(-50%, -50%) scale(1.3) rotate(10deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); opacity: 0.95; }
        }

        @keyframes floatUpText {
            0% { transform: translate(-50%, 0); opacity: 0; }
            20% { opacity: 1; }
            100% { transform: translate(-50%, -45px); opacity: 0; }
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

  
    <div class="envelope-wrapper" id="envelopeBtn">
        <div class="envelope">
           <span class="envelope-text">Sadece senin için... ✉️</span>
        </div>
        <div class="envelope-hint">Mektubu açmak için dokun ✨</div>
    </div>

  
    <div class="card-container" id="mainCard">
        <div class="card-title">Hayatıma Açan En Güzel Çiçeğe... 🌸</div>
        <div class="card-body" id="typedText"></div>
        <div class="click-hint-badge" id="clickBadge">✨ Ekranın istediğin yerine tıkla/dokun! ✨</div>
    </div>

    <script>
        const envelopeBtn = document.getElementById('envelopeBtn');
        const mainCard = document.getElementById('mainCard');
        const typedTextEl = document.getElementById('typedText');
        const clickBadge = document.getElementById('clickBadge');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

       
        const message = "Sen yeryüzünde bulunan tüm çiçeklerin kıskanacağı türde yalnız kalbimin içinde açan bir çiçeksin . Zarfa tıklayarak karanlığın içerisinde çiçekler açtırdığın gibi benim içimde de kendinden parçalar taşıyan bir bahar bahçesi oluşturdun. Hayatımın Linası  İyi ki varsın... 💕";
        let charIndex = 0;

       
        const flowerEmojis = ['🌸', '🌺', '🌷', '🌹', '🌻', '🌼', '💐', '✨'];
        const cuteWords = [
            "En güzel baharım ✨", 
            "Bebeisim 🌸", 
            "İyi ki varsın 💕", 
            "Hayatımın Linası 🌟", 
            "Çiçeğim 🌷", 
            "Güzelim 💖",
            "Hatunum 🌍"
        ];

        let isActive = false;

        
        envelopeBtn.addEventListener('click', () => {
            envelopeBtn.classList.add('hide');
            document.body.classList.add('active-theme');
            
            setTimeout(() => {
                mainCard.classList.add('show');
                startTyping();
                startBackgroundEffects();
                burstConfetti();
                isActive = true;
            }, 700);
        });

     
        function startTyping() {
            if (charIndex < message.length) {
                typedTextEl.innerHTML += message.charAt(charIndex);
                charIndex++;
                setTimeout(startTyping, 40);
            } else {
                clickBadge.classList.add('show');
            }
        }

       
        window.addEventListener('click', (e) => {
            if (!isActive) return;
            if (e.target.closest('.card-container')) return;

            spawnFlower(e.clientX, e.clientY);
        });

        function spawnFlower(x, y) {
            const flower = document.createElement('div');
            flower.className = 'spawned-flower';
            flower.innerText = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
            flower.style.left = x + 'px';
            flower.style.top = y + 'px';
            document.body.appendChild(flower);

            const text = document.createElement('div');
            text.className = 'spawned-text';
            text.innerText = cuteWords[Math.floor(Math.random() * cuteWords.length)];
            text.style.left = x + 'px';
            text.style.top = (y - 30) + 'px';
            document.body.appendChild(text);

            setTimeout(() => flower.remove(), 2500);
            setTimeout(() => text.remove(), 2000);
        }

        
        let petals = [];
        let particles = [];

        class Petal {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * -height;
                this.size = Math.random() * 10 + 6;
                this.speedY = Math.random() * 1.2 + 0.6;
                this.speedX = Math.random() * 0.8 - 0.4;
                this.angle = Math.random() * 360;
                this.spin = Math.random() * 0.02 - 0.01;
                this.color = `rgba(255, ${Math.floor(Math.random() * 50 + 180)}, ${Math.floor(Math.random() * 50 + 200)}, ${Math.random() * 0.4 + 0.3})`;
            }

            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y * 0.01) + this.speedX;
                this.angle += this.spin;

                if (this.y > height) {
                    this.y = -20;
                    this.x = Math.random() * width;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.beginPath();
                ctx.fillStyle = this.color;
                ctx.ellipse(0, 0, this.size, this.size / 2, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function burstConfetti() {
            const colors = ['#ff80ab', '#ff4081', '#ea80fc', '#ffd54f', '#ffffff'];
            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: width / 2,
                    y: height / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.5) * 16 - 2,
                    size: Math.random() * 6 + 3,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1
                });
            }
        }

        function startBackgroundEffects() {
            for (let i = 0; i < 40; i++) {
                petals.push(new Petal());
            }
            animate();
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);

            
            petals.forEach(p => {
                p.update();
                p.draw();
            });

           
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.12; // yerçekimi
                p.alpha -= 0.015;

                ctx.save();
                ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();

                if (p.alpha <= 0) particles.splice(index, 1);
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
